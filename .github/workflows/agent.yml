name: OCaml Opportunity Agent

on:
  schedule:
    - cron: '30 1 * * *' # 1:30 AM UTC = 7:00 AM IST
  workflow_dispatch:

concurrency:
  group: ocaml-agent-run
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Clone private state repo
        env:
          STATE_REPO_PAT: ${{ secrets.OCAML_AGENT_STATE_PAT }}
        run: |
          git clone -b master "https://x-access-token:${STATE_REPO_PAT}@github.com/adithn875/ocaml-opportunity-agent-state.git" state-repo
          ls -la state-repo/

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

     
      - name: Set up OCaml and build scorer
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y opam
          export OPAMYES=1
          opam init --disable-sandboxing --bare -y
          opam switch create ci ocaml-system -y
          eval "$(opam env --switch=ci)"
          opam install yojson dune.3.24.0 -y
          cd ocaml-scoring/ocaml_scoring
          dune build

      - name: Restore agent database
        run: |
          mkdir -p data
          cp state-repo/agent.db data/agent.db
          ls -la data/

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection
        timeout-minutes: 20
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -m ocaml_agent.main collect

      - name: Run candidate filtering and LLM scoring
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -m ocaml_agent.main score

      - name: Calculate final rankings
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -m ocaml_agent.main rank --write

      - name: Sync jobs to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          source .venv/bin/activate
          set +e
          PYTHONPATH=src python -m ocaml_agent.supabase_sync 2>&1 | tee sync-output.log
          sync_status=${PIPESTATUS[0]}
          set -e
          if [ "$sync_status" -ne 0 ]; then
            tail -n 15 sync-output.log > sync-failure.txt
            exit "$sync_status"
          fi

      - name: Deliver opted-in Telegram alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -m ocaml_agent.user_alerts

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -m ocaml_agent.main notify

      - name: Update private state repo
        env:
          STATE_REPO_PAT: ${{ secrets.OCAML_AGENT_STATE_PAT }}
        run: |
          cp data/agent.db state-repo/agent.db
          cd state-repo
          git config user.name "OCaml Agent"
          git config user.email "agent@ocaml-opportunity.local"
          git add agent.db
          git commit -m "Update agent.db from GitHub Actions run" || echo "No changes to commit"
          git push
          cd ../

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=src python -c 'from pathlib import Path; from ocaml_agent.telegram import send_message; details = Path("sync-failure.txt").read_text() if Path("sync-failure.txt").exists() else "A pipeline step failed before Supabase sync."; send_message("🚨 OCaml Opportunity Agent failed\n\n" + details[-3000:] + "\n\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")' || true
