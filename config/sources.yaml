# One entry per source.
#
# method:
#   yaml_file   - data file in a GitHub repo
#   json_api    - public JSON endpoint
#   html        - static HTML, Scrapling Fetcher
#   js_rendered - page needs a browser fetcher
#   rss         - RSS/Atom feed
#   manual      - not reliably scrapeable yet; check by hand
#
# status:
#   verified    - URL loads and is suitable for the declared method
#   to_verify   - URL/method still needs investigation
#   stale       - source loads but current opportunity data is uncertain
#
# If `api` exists, it is the endpoint the collector should use instead
# of `url`.

aggregators:

  - name: OCaml.org jobs
    url: "https://ocaml.org/jobs"
    api: "https://raw.githubusercontent.com/ocaml/ocaml.org/main/data/jobs.yml"
    method: yaml_file
    status: verified
    note: >
      The jobs page may be bot-blocked. The page is built from this
      YAML file in the ocaml/ocaml.org repository, so use the YAML
      source for collection.

  - name: OCaml Discuss Jobs
    url: "https://discuss.ocaml.org/c/community/jobs/14"
    method: rss
    status: verified
    note: "HTTP 200. Prefer the RSS feed if available."

  - name: HN Who's Hiring (OCaml)
    url: "https://hnhiring.com/technologies/ocaml"
    method: html
    status: verified
    note: "HTTP 200 and robots.txt allows access."

  - name: Tezos ecosystem careers
    url: "https://careers.tezos.com/companies"
    method: html
    status: verified
    note: "Original URL redirects to /companies; use the working canonical URL."


